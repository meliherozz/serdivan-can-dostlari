services:
  postgres:
    image: postgres:16-alpine
    container_name: serdivan-can-dostlari-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serdivan_can_dostlari}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_dev}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - serdivan_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-serdivan_can_dostlari}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serdivan_postgres_data: